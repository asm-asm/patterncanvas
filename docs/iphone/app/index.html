<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Web版の公開終了 — 編みものノート</title><style>body{font:16px/1.8 -apple-system,sans-serif;background:#f5f7f2;color:#30483e;margin:0;padding:24px}main{max-width:560px;margin:8vh auto}h1{font-size:24px}button,a{color:#30483e}button{font:inherit;padding:12px;border-radius:10px;border:1px solid #52796b;background:white;touch-action:manipulation}</style></head><body><main><h1>iPhone向けWeb版は公開を終了しました</h1><p>Web版での編み図の作成・編集は終了しました。iPhone・iPadアプリは引き続きご利用いただけます。</p><p>このブラウザに保存済みの作品は削除していません。下のボタンでJSONファイルとして保管できます。</p><button id="export">保存済みの作品を書き出す</button><p id="status" role="status"></p><p><a href="/patterncanvas/app-store/support/">使い方・お問い合わせ</a></p></main><script>
document.getElementById('export').onclick=()=>{const status=document.getElementById('status');try{const raw=localStorage.getItem('patterncanvas-iphone-v1');if(!raw){status.textContent='このブラウザに保存済みの作品は見つかりませんでした。以前使っていた端末・ブラウザでお試しください。';return;}const url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='amimono-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='作品ファイルを書き出しました。';}catch{status.textContent='保存データを読み取れませんでした。ブラウザのデータは削除せず、お問い合わせください。';}};
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>new URL(r.scope).pathname==='/patterncanvas/iphone/app/').map(r=>r.update()))).catch(()=>{});
</script></body></html>
