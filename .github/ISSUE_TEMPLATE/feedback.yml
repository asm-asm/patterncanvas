name: 不具合・ご要望
description: 編みものノートの使い心地を教えてください
title: "[フィードバック] "
body:
  - type: markdown
    attributes:
      value: "ご協力ありがとうございます。この投稿は公開されます。個人情報や非公開の作品を載せないでください。"
  - type: input
    id: device
    attributes:
      label: お使いの機種とOSバージョン
      placeholder: "例：iPhone、iOS 26 / Galaxy、Android 16"
  - type: input
    id: version
    attributes:
      label: アプリの種類とバージョン
      placeholder: "例：App Store版 1.0.0 / iPhone Web版 / Android版"
  - type: textarea
    id: description
    attributes:
      label: 起きたこと・ご要望
      description: 何を操作した時に、どうなったか教えてください。
    validations:
      required: true
