name: Store simulator capture
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-store-capture.yml'
      - 'scripts/*capture*'
    branches: [feature/iphone-paid-pwa]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run ios:sync
      - run: node scripts/prepare-store-capture.mjs
      - name: Build unsigned simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath capture-build CODE_SIGNING_ALLOWED=NO build > capture-build.log 2>&1
      - run: python3 scripts/capture-simulator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-store-capture
          path: |
            store-capture/
            capture-build.log
          retention-days: 7
