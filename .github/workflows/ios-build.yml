name: iOS build verification
on:
  push:
    branches: [feature/iphone-paid-pwa]
    paths: ['ios/**', 'native/**', 'docs/iphone/app/**', 'scripts/build-native.mjs', 'package*.json', 'capacitor.config.json', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**', 'native/**', 'docs/iphone/app/**', 'package*.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    if: github.event_name != 'pull_request' || github.head_ref != 'feature/iphone-paid-pwa'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci
      - run: npm test && npm run test:native && npm run ios:sync
      - name: Build for iPhone simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/App/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Capture iPhone and iPad store screenshots
        run: python3 scripts/capture-store-screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: AmimonoNote-iOS-Simulator
          path: ios/App/DerivedData/Build/Products/Release-iphonesimulator/App.app
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-verification
          path: native-verification/
          retention-days: 7
