name: Native StoreKit tests
on:
  workflow_dispatch:
  push:
    branches: [feature/iphone-paid-pwa]
    paths:
      - '.github/workflows/ios-storekit-tests.yml'
      - 'tests/storekit/**'
      - 'scripts/prepare-storekit-tests.cjs'
      - 'ios/App/App/PurchasesPlugin.swift'
      - 'docs/iphone/app/purchase-access.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci && npm run ios:sync
      - run: node scripts/prepare-storekit-tests.cjs
      - name: Test real StoreKit on iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,ds in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) for d in ds if "iPhone" in d["name"]))')
          set +e
          xcodebuild -project ios/App/App.xcodeproj -scheme PurchaseTests -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath storekit-results.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test > storekit-tests.log 2>&1
          RESULT=$?
          set -e
          find "$HOME/Library/Developer/CoreSimulator/Devices" -name iap-review.png -exec cp {} iap-review.png \; -quit
          exit "$RESULT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storekit-tests
          path: |
            storekit-tests.log
            iap-review.png
          retention-days: 7
